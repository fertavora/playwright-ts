name: Playwright Tests
on:
  push:
    branches: [ main, develop ]
jobs:
  saucedemo-test:
    name: 'SauceDemo Functional Tests'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: yarn
    - name: Run Playwright tests
      run: yarn test:saucedemo
      env:
        SAUCE_BASE_URL: ${{ vars.SAUCE_BASE_URL }}
        SAUCE_USERNAME: ${{ vars.SAUCE_USER }}
        SAUCE_PASSWORD: ${{ vars.SAUCE_PASSWORD }}
  argenprop-test:
    name: 'Argenprop Web Scrapping'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: yarn
    - name: Run Playwright tests
      run: yarn test:argenprop
      env:
        ARGENPROP_BASE_URL: ${{ vars.ARGENPROP_BASE_URL }}